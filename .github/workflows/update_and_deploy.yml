name: Update feed and deploy to GitHub Pages

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update_and_deploy.yml"

permissions:
  contents: write   # commit refreshed feed.json (keeps history between runs)
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and score feeds
        run: python scripts/fetch_feeds.py

      - name: Commit updated feed (skipped if unchanged)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/feed.json
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "chore: update feed [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push || echo "Push skipped (e.g. protected branch or non-branch ref)."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
